name: Deploy to GitHub Pages

# Builds the Vite + React app and publishes the static output to GitHub Pages.
# IMPORTANT: in the repo settings, set Pages → Build and deployment → Source
# to "GitHub Actions" (one-time setup).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional AI scan key — add as a repo secret to enable it.
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}
      # Append ?v=<unix-timestamp> to all ./assets/ src/href in dist/index.html
      # so that every deploy invalidates the CDN-cached JS/CSS bundles even
      # though filenames are stable (no content hash in vite.config.js).
      - name: Stamp asset URLs with build timestamp
        run: |
          python3 - <<'EOF'
          import re, time
          ts = int(time.time())
          with open('dist/index.html') as f:
              html = f.read()
          html = re.sub(
              r'((?:src|href)=")(\./assets/[^"]+)(")',
              lambda m: m.group(1) + m.group(2) + '?v=' + str(ts) + m.group(3),
              html
          )
          with open('dist/index.html', 'w') as f:
              f.write(html)
          print(f'Stamped assets with v={ts}')
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
