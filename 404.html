<!-- ═══════════════════════════════════════════════════════════════════
     THE HOME-SCREEN ICON THAT LANDED ON A 404

     "Add to Home Screen" with no manifest is a plain bookmark: Android
     freezes whatever URL was open at that moment. Somebody who installed
     while on /app.html — the entry this repo's own notes tell you to open
     in dev — got an icon pointing at a URL the published site may not
     have. GitHub Pages then serves this page.

     There is no 404 worth showing a Field Conductor standing in a plot.
     Every URL on this site is the same app; the route lives in the hash.
     So anything unknown goes to the root, carrying the hash with it, and
     the app opens where they meant to be.

     GitHub Pages serves this file for any path it does not have, under
     both builders — the workflow copies public/ into dist, and dist back
     into the repository root.
     ═══════════════════════════════════════════════════════════════════ -->
<noscript>This page has moved. <a href="/">Open the FC Portal</a>.</noscript>
<div id="m">Opening the FC Portal…</div>
<script>
  (function () {
    try {
      /* The hash IS the route — HashRouter, see vite.config.js — so it is
         carried across. A shortcut to /app.html#/worker still lands on the
         worker portal. */
      var to = '/' + (location.hash || '');
      /* Never bounce off the root itself. If / is what 404'd, redirecting
         to / is a loop, and a loop is worse than the message. */
      if (location.pathname === '/' || location.pathname === '') {
        document.getElementById('m').textContent =
          'The FC Portal could not be loaded. Check your connection and try again.';
        return;
      }
      location.replace(to);
    } catch (e) {
      location.href = '/';
    }
  })();
</script>
</body>
