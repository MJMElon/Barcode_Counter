<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MJM Scan">
<title>MJM Scan Counter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
<style>
  :root {
    --bg: #0a0f14;
    --bg-elev: #111821;
    --bg-card: #0f1620;
    --border: #1f2a38;
    --text: #e6edf3;
    --muted: #7d8a9c;
    --accent: #00ff9d;
    --accent-dim: #00cc7d;
    --warn: #ffc857;
    --danger: #ff4d6d;
    --grid: rgba(0, 255, 157, 0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(ellipse at top, rgba(0, 255, 157, 0.08) 0%, transparent 60%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    padding: 20px;
    padding-bottom: 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .brand .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .status.scanning { color: var(--accent); }
  .status.done { color: var(--warn); }
  .status.over { color: var(--danger); }
  .status.error { color: var(--danger); }
  .status.offline { color: var(--warn); }
  .net-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .net-dot.offline { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .view { display: none; }
  .view.active { display: block; }

  /* --- Top bar (list) --- */
  .list-actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin-bottom: 14px;
  }
  .list-actions .btn { padding: 12px 14px; font-size: 12px; }

  .add-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .add-card .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .form-grid {
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr 110px;
  }
  .form-grid input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .form-grid input:focus { border-color: var(--accent); }
  .form-grid .full { grid-column: span 2; }
  .form-grid .row { display: flex; gap: 8px; grid-column: span 2; }
  .form-grid .row .btn { flex: 1; }

  /* --- Consent list --- */
  .consent-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .consent-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .consent-row:hover { border-color: var(--accent); }
  .consent-row.complete { border-color: var(--accent-dim); }
  .consent-row.over { border-color: var(--danger); }
  .consent-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }
  .consent-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    grid-column: 1 / 2;
  }
  .consent-meta b { color: var(--text); font-weight: 600; }
  .consent-meta .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    margin-right: 6px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .consent-meta .pill.done { color: var(--accent); border-color: var(--accent-dim); }
  .consent-meta .pill.over { color: var(--danger); border-color: var(--danger); }
  .consent-meta .pill.progress { color: var(--warn); border-color: var(--warn); }
  .consent-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    grid-row: 1 / span 2;
    grid-column: 2;
  }
  .row-mini-progress {
    grid-column: 1 / 2;
    height: 4px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 4px;
  }
  .row-mini-progress > div {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.25s ease;
  }
  .row-mini-progress.over > div { background: var(--danger); }
  .row-mini-progress.done > div { background: var(--warn); }

  .empty-list {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--bg-card);
    border: 1px dashed var(--border);
    border-radius: 14px;
  }

  /* --- Scanner --- */
  .scanner-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .back-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .scanner-title { flex: 1; min-width: 0; }
  .scanner-title h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 2px;
    word-break: break-word;
  }
  .scanner-title .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .scanner-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #reader {
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    min-height: 240px;
  }
  #reader__scan_region { background: #000 !important; }
  #reader video { border-radius: 12px; }
  #reader__dashboard_section_csr button {
    background: var(--accent) !important;
    color: var(--bg) !important;
    border: none !important;
    padding: 10px 20px !important;
    border-radius: 8px !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    margin-top: 8px !important;
  }
  .start-row {
    margin-top: 12px;
  }

  .counter-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px 20px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .counter-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .counter-card.over { border-color: var(--danger); }
  .counter-card.over::before { background: linear-gradient(90deg, transparent, var(--danger), transparent); }
  .counter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .counter-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 78px;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(0, 255, 157, 0.3);
    transition: transform 0.15s ease;
  }
  .counter-value .target {
    font-size: 26px;
    color: var(--muted);
    text-shadow: none;
    margin-left: 4px;
  }
  .counter-value.bump { transform: scale(1.12); }
  .counter-value.done { color: var(--warn); text-shadow: 0 0 40px rgba(255, 200, 87, 0.4); }
  .counter-value.over { color: var(--danger); text-shadow: 0 0 40px rgba(255, 77, 109, 0.45); }

  .progress {
    height: 6px;
    background: var(--bg);
    border-radius: 999px;
    margin-top: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.25s ease;
  }
  .progress-fill.done { background: var(--warn); }
  .progress-fill.over { background: var(--danger); }

  .alert-banner {
    display: none;
    margin-top: 14px;
    background: rgba(255, 77, 109, 0.08);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 12px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    line-height: 1.5;
    animation: alertFlash 0.8s ease infinite alternate;
  }
  .alert-banner.show { display: block; }
  @keyframes alertFlash {
    from { background: rgba(255, 77, 109, 0.08); }
    to { background: rgba(255, 77, 109, 0.18); }
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .stat-value.danger { color: var(--danger); }

  .last-scan {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
    word-break: break-all;
  }
  .last-scan b { color: var(--text); font-weight: 600; }
  .last-scan.over b { color: var(--danger); }

  button.btn {
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    width: 100%;
  }
  button.btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.btn.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }
  button.btn.primary:hover {
    background: var(--accent-dim);
    color: var(--bg);
  }
  button.btn.small {
    padding: 8px 12px;
    font-size: 11px;
    width: auto;
  }

  .log-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .log-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .log-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
  }
  .log {
    max-height: 260px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  .log-item:last-child { border-bottom: none; }
  .log-item .code { color: var(--text); flex: 1; word-break: break-all; }
  .log-item .time { font-size: 10px; flex-shrink: 0; }
  .log-item.over .code { color: var(--danger); }
  .log-item .tag {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .log-item.over .tag { color: var(--danger); }
  .empty {
    text-align: center;
    padding: 24px 0;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.warn { border-color: var(--warn); color: var(--warn); }
  .toast.danger { border-color: var(--danger); color: var(--danger); }
  .toast.done { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>MJM // SCAN</div>
    <div class="status" id="status"><span class="net-dot" id="netDot"></span><span id="statusText">STANDBY</span></div>
  </header>

  <!-- =========== VIEW: CONSENT LIST =========== -->
  <section class="view active" id="view-list">
    <h1>Signed Consents</h1>
    <p class="subtitle">Tap a customer to start collection.</p>

    <div class="list-actions">
      <button class="btn primary" id="addToggle">+ Add Consent</button>
      <button class="btn" id="syncBtn">Sync</button>
    </div>

    <div class="add-card" id="addCard" hidden>
      <div class="section-title">New Consent</div>
      <div class="form-grid">
        <input type="text" id="newName" placeholder="Customer name" />
        <input type="number" id="newQty" placeholder="Qty" min="1" inputmode="numeric" />
        <input type="text" id="newRef" class="full" placeholder="Consent ref / notes (optional)" />
        <div class="row">
          <button class="btn" id="cancelAddBtn">Cancel</button>
          <button class="btn primary" id="saveAddBtn">Save</button>
        </div>
      </div>
    </div>

    <div class="consent-list" id="consentList"></div>

    <input type="file" id="importFile" accept="application/json" hidden />
  </section>

  <!-- =========== VIEW: SCANNER =========== -->
  <section class="view" id="view-scanner">
    <div class="scanner-header">
      <button class="back-btn" id="backBtn">← Back</button>
      <div class="scanner-title">
        <h2 id="scanCustomer">—</h2>
        <div class="meta" id="scanRef">—</div>
      </div>
    </div>

    <div class="scanner-card">
      <div id="reader"></div>
      <div class="start-row">
        <button class="btn primary" id="startBtn">Start Camera</button>
      </div>
    </div>

    <div class="counter-card" id="counterCard">
      <div class="counter-label">Sealed Scanned</div>
      <div class="counter-value" id="count">0<span class="target" id="targetLabel">/0</span></div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="alert-banner" id="alertBanner"></div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Remaining</span>
          <span class="stat-value" id="remainStat">0</span>
        </div>
      </div>
      <div class="last-scan" id="lastScan">Awaiting first scan…</div>
    </div>

    <div class="log-card">
      <div class="log-header">
        <div class="log-title">Scan Log</div>
        <div class="log-count" id="logCount">0 entries</div>
      </div>
      <div class="log" id="log">
        <div class="empty">No scans yet</div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  const CONSENTS_KEY = 'mjm.consents.v2';
  const DEDUPE_DEBOUNCE_MS = 800;
  const OVER_REPEAT_MS = 1200;

  /** @type {Array<{id:string, customer:string, qty:number, ref:string, createdAt:number, scans:Array<{code:string,time:string,over:boolean}>, seen:string[], unique:number, over:number, completedAt:number|null, completedFired:boolean, overFired:boolean}>} */
  let consents = [];
  let activeId = null;
  /** @type {Set<string>} */
  let seen = new Set();
  let lastCode = '';
  let lastTime = 0;
  let lastOverAlertTime = 0;

  const $ = (id) => document.getElementById(id);
  const statusWrap = $('status');
  const statusEl = $('statusText');
  const netDot = $('netDot');
  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusWrap.className = 'status' + (kind ? ' ' + kind : '');
  }
  const viewList = $('view-list');
  const viewScanner = $('view-scanner');
  const consentListEl = $('consentList');
  const scanCustomer = $('scanCustomer');
  const scanRef = $('scanRef');
  const counterCard = $('counterCard');
  const countEl = $('count');
  const targetLabel = $('targetLabel');
  const progressFill = $('progressFill');
  const alertBanner = $('alertBanner');
  const remainStat = $('remainStat');
  const lastEl = $('lastScan');
  const logEl = $('log');
  const logCountEl = $('logCount');
  const toastEl = $('toast');

  // ---------- Audio ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type = 'sine', volume = 0.25) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0;
    osc.connect(gain).connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.linearRampToValueAtTime(volume, now + 0.01);
    gain.gain.linearRampToValueAtTime(0, now + duration);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }
  function beepSuccess() { beep(1150, 0.08, 'square', 0.22); }
  function beepDuplicate() { beep(420, 0.18, 'sine', 0.18); }
  function beepComplete() {
    beep(900, 0.1, 'square', 0.25);
    setTimeout(() => beep(1300, 0.1, 'square', 0.25), 110);
    setTimeout(() => beep(1700, 0.18, 'square', 0.28), 230);
  }
  function beepAlarm() {
    beep(1600, 0.12, 'sawtooth', 0.32);
    setTimeout(() => beep(700, 0.18, 'sawtooth', 0.32), 130);
    setTimeout(() => beep(1600, 0.12, 'sawtooth', 0.32), 320);
    setTimeout(() => beep(700, 0.22, 'sawtooth', 0.32), 450);
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function toast(msg, kind = '') {
    toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
    toastEl.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  // ---------- Persistence ----------
  function saveAll() {
    try { localStorage.setItem(CONSENTS_KEY, JSON.stringify(consents)); } catch (e) {}
  }
  function loadAll() {
    try {
      const raw = localStorage.getItem(CONSENTS_KEY);
      if (raw) consents = JSON.parse(raw) || [];
    } catch (e) { consents = []; }
    // Migrate older shape if needed
    consents.forEach(c => {
      if (!Array.isArray(c.scans)) c.scans = [];
      if (!Array.isArray(c.seen)) c.seen = [];
      if (typeof c.unique !== 'number') c.unique = c.seen.length;
      if (typeof c.over !== 'number') c.over = 0;
      if (!('completedFired' in c)) c.completedFired = c.unique >= c.qty;
      if (!('overFired' in c)) c.overFired = c.unique > c.qty;
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function activeConsent() {
    return consents.find(c => c.id === activeId);
  }
  function statusOf(c) {
    if (c.unique > c.qty) return 'over';
    if (c.unique >= c.qty && c.qty > 0) return 'done';
    if (c.unique > 0) return 'progress';
    return 'pending';
  }

  // ---------- Consent list rendering ----------
  function renderConsentList() {
    if (consents.length === 0) {
      consentListEl.innerHTML = '<div class="empty-list">No signed consents yet.</div>';
      return;
    }
    const order = { over: 0, progress: 1, pending: 2, done: 3 };
    const sorted = consents.slice().sort((a, b) => {
      const sa = order[statusOf(a)];
      const sb = order[statusOf(b)];
      if (sa !== sb) return sa - sb;
      return b.createdAt - a.createdAt;
    });
    consentListEl.innerHTML = sorted.map(c => {
      const st = statusOf(c);
      const pct = c.qty > 0 ? Math.min(100, (c.unique / c.qty) * 100) : 0;
      const pillClass = st === 'done' ? 'done' : st === 'over' ? 'over' : st === 'progress' ? 'progress' : '';
      const pillLabel = st === 'done' ? 'COMPLETE' : st === 'over' ? 'OVER' : st === 'progress' ? 'IN PROGRESS' : 'PENDING';
      return `
        <div class="consent-row ${st === 'done' ? 'complete' : ''} ${st === 'over' ? 'over' : ''}" data-id="${c.id}">
          <div class="consent-name">${escapeHtml(c.customer)}</div>
          <div class="consent-actions">
            <button class="btn primary small" data-act="start" data-id="${c.id}">Start</button>
          </div>
          <div class="consent-meta">
            <span class="pill ${pillClass}">${pillLabel}</span>
            Qty <b>${c.qty}</b> · Scanned <b>${c.unique}</b>${c.over ? ` · Over <b style="color:var(--danger)">${c.over}</b>` : ''}${c.ref ? ` · ${escapeHtml(c.ref)}` : ''}
          </div>
          <div class="row-mini-progress ${st === 'done' ? 'done' : ''} ${st === 'over' ? 'over' : ''}">
            <div style="width:${pct}%"></div>
          </div>
        </div>
      `;
    }).join('');
  }

  consentListEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act="start"]');
    if (btn) {
      e.stopPropagation();
      openScanner(btn.getAttribute('data-id'));
      return;
    }
    const row = e.target.closest('.consent-row');
    if (row) openScanner(row.getAttribute('data-id'));
  });

  // ---------- Scanner view ----------
  async function openScanner(id) {
    const c = consents.find(x => x.id === id);
    if (!c) return;
    activeId = id;
    seen = new Set(c.seen || []);
    lastCode = ''; lastTime = 0; lastOverAlertTime = 0;

    scanCustomer.textContent = c.customer;
    scanRef.textContent = `Qty ${c.qty}` + (c.ref ? ` · ${c.ref}` : '');
    viewList.classList.remove('active');
    viewScanner.classList.add('active');
    renderScanner();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  async function closeScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
    }
    activeId = null;
    seen = new Set();
    viewScanner.classList.remove('active');
    viewList.classList.add('active');
    setStatus('STANDBY');
    $('startBtn').textContent = 'Start Camera';
    renderConsentList();
  }

  $('backBtn').addEventListener('click', closeScanner);

  function renderScanner() {
    const c = activeConsent();
    if (!c) return;
    const st = statusOf(c);
    const remain = Math.max(0, c.qty - c.unique);

    countEl.firstChild.nodeValue = String(c.unique);
    targetLabel.textContent = '/' + c.qty;
    remainStat.textContent = String(remain);
    remainStat.classList.toggle('danger', c.unique > c.qty);

    const pct = c.qty > 0 ? Math.min(100, (c.unique / c.qty) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressFill.classList.toggle('done', st === 'done');
    progressFill.classList.toggle('over', st === 'over');

    countEl.classList.toggle('done', st === 'done');
    countEl.classList.toggle('over', st === 'over');
    counterCard.classList.toggle('over', st === 'over');

    if (st === 'over') {
      const excess = c.unique - c.qty;
      alertBanner.textContent = `OVER QUOTA · ${c.unique} / ${c.qty} (excess ${excess})`;
      alertBanner.classList.add('show');
    } else {
      alertBanner.classList.remove('show');
    }

    if (html5QrCode && html5QrCode.isScanning) {
      if (st === 'over') setStatus('OVER QUOTA', 'over');
      else if (st === 'done') setStatus('TARGET REACHED', 'done');
      else setStatus('SCANNING', 'scanning');
    }

    if (c.scans.length === 0) {
      logEl.innerHTML = '<div class="empty">No scans yet</div>';
      logCountEl.textContent = '0 entries';
    } else {
      logCountEl.textContent = c.scans.length + ' entr' + (c.scans.length === 1 ? 'y' : 'ies');
      logEl.innerHTML = c.scans.slice(0, 100).map(s => {
        const cls = s.over ? 'over' : '';
        const tag = s.over ? '<span class="tag">OVER</span>' : '';
        return `<div class="log-item ${cls}">
                  <span class="code">${escapeHtml(s.code)}</span>
                  ${tag}
                  <span class="time">${s.time}</span>
                </div>`;
      }).join('');
    }
  }

  function bump() {
    countEl.classList.add('bump');
    setTimeout(() => countEl.classList.remove('bump'), 150);
  }

  // ---------- Scan handling (unique only) ----------
  function registerScan(rawCode) {
    const c = activeConsent();
    if (!c) return;
    const code = String(rawCode).trim();
    if (!code) return;

    const now = Date.now();
    if (code === lastCode && (now - lastTime) < DEDUPE_DEBOUNCE_MS) return;
    lastCode = code;
    lastTime = now;

    // Duplicate: do NOT count, do NOT log. Just acknowledge with a tone.
    if (seen.has(code)) {
      beepDuplicate();
      if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
      toast('Duplicate: ' + code, 'warn');
      return;
    }

    // Unique scan
    seen.add(code);
    c.seen.push(code);
    c.unique++;
    const time = new Date().toLocaleTimeString();
    const willBeOver = c.unique > c.qty;
    c.scans.unshift({ code, time, over: willBeOver });

    if (willBeOver) {
      c.over++;
      lastEl.classList.add('over');
      lastEl.innerHTML = `Over: <b>${escapeHtml(code)}</b>`;
      if ((Date.now() - lastOverAlertTime) > OVER_REPEAT_MS) {
        beepAlarm();
        lastOverAlertTime = Date.now();
      }
      if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 200]);
      toast(`Over quota! ${c.unique}/${c.qty}`, 'danger');
      c.overFired = true;
    } else {
      lastEl.classList.remove('over');
      lastEl.innerHTML = `Last: <b>${escapeHtml(code)}</b>`;
      beepSuccess();
      if (navigator.vibrate) navigator.vibrate(40);
    }
    bump();

    if (!c.completedFired && c.unique === c.qty) {
      c.completedFired = true;
      c.completedAt = Date.now();
      beepComplete();
      if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 200]);
      toast(`Target ${c.qty} reached!`, 'done');
    }

    renderScanner();
    saveAll();
  }

  // ---------- Camera scanner ----------
  let html5QrCode = null;
  const startBtn = $('startBtn');

  function preferredCameraId(cameras) {
    const back = cameras.find(c => /back|rear|environment/i.test(c.label));
    return (back || cameras[cameras.length - 1] || cameras[0]).id;
  }

  async function startCamera() {
    ensureAudio();
    html5QrCode = new Html5Qrcode('reader', { verbose: false });
    const hiRes = {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
    };
    const config = {
      fps: 15,
      qrbox: (vw, vh) => {
        // Wide, generous scan window so the user can hold the phone further back.
        const w = Math.floor(Math.min(vw * 0.95, 520));
        const h = Math.floor(Math.min(vh * 0.7, 300));
        return { width: w, height: h };
      },
      aspectRatio: 1.7778,
      disableFlip: false,
      videoConstraints: { ...hiRes, facingMode: 'environment' },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
      ],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    };

    // Build camera selection with hi-res constraints so phones pick a sensor
    // capable of focusing on small, distant barcodes.
    let cameraConfig = { ...hiRes, facingMode: 'environment' };
    try {
      const cams = await Html5Qrcode.getCameras();
      if (cams && cams.length) {
        const back = cams.find(c => /back|rear|environment/i.test(c.label));
        const chosen = back || cams[cams.length - 1];
        cameraConfig = { ...hiRes, deviceId: { exact: chosen.id } };
      }
    } catch (e) { /* fall back */ }

    try {
      await html5QrCode.start(
        cameraConfig,
        config,
        (decodedText) => registerScan(decodedText),
        () => {}
      );
    } catch (err) {
      // Retry with looser constraints if hi-res fails.
      await html5QrCode.start(
        { facingMode: 'environment' },
        config,
        (decodedText) => registerScan(decodedText),
        () => {}
      );
    }

    // Try to enable continuous autofocus on the active video track. Optional —
    // not all devices/browsers expose it.
    try {
      const video = document.querySelector('#reader video');
      const stream = video && video.srcObject;
      const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
      if (track && track.applyConstraints) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }
    } catch (e) { /* ignore */ }

    startBtn.textContent = 'Stop Camera';
    renderScanner();
  }

  async function stopCamera() {
    try {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
        await html5QrCode.clear();
      }
    } catch (e) {}
    startBtn.textContent = 'Start Camera';
    setStatus('STANDBY');
  }

  startBtn.addEventListener('click', async () => {
    if (!activeConsent()) { toast('Open a consent first'); return; }
    if (html5QrCode && html5QrCode.isScanning) {
      await stopCamera();
      return;
    }
    try {
      await startCamera();
    } catch (err) {
      console.error(err);
      setStatus('ERROR', 'error');
      alert('Camera error: ' + (err && err.message ? err.message : err));
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!html5QrCode || !html5QrCode.isScanning) return;
    if (document.hidden) {
      try { html5QrCode.pause(true); } catch (e) {}
      setStatus('PAUSED');
    } else {
      try { html5QrCode.resume(); } catch (e) {}
      renderScanner();
    }
  });

  // ---------- Add Consent ----------
  const addCard = $('addCard');
  const addToggle = $('addToggle');
  function showAddForm(show) {
    addCard.hidden = !show;
    addToggle.textContent = show ? '× Cancel' : '+ Add Consent';
    if (show) setTimeout(() => $('newName').focus(), 50);
  }
  addToggle.addEventListener('click', () => showAddForm(addCard.hidden));
  $('cancelAddBtn').addEventListener('click', () => {
    $('newName').value = ''; $('newQty').value = ''; $('newRef').value = '';
    showAddForm(false);
  });
  $('saveAddBtn').addEventListener('click', () => {
    const name = $('newName').value.trim();
    const qty = parseInt($('newQty').value, 10);
    const ref = $('newRef').value.trim();
    if (!name) { toast('Enter customer name', 'warn'); $('newName').focus(); return; }
    if (!qty || qty < 1) { toast('Enter valid qty', 'warn'); $('newQty').focus(); return; }
    consents.push({
      id: 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7),
      customer: name, qty, ref,
      createdAt: Date.now(),
      scans: [], seen: [],
      unique: 0, over: 0,
      completedAt: null, completedFired: false, overFired: false,
    });
    $('newName').value = ''; $('newQty').value = ''; $('newRef').value = '';
    saveAll();
    showAddForm(false);
    renderConsentList();
    toast('Consent added', 'done');
  });

  // ---------- Sync (local backup / restore) ----------
  // No remote backend: "sync" downloads a JSON snapshot of all consents +
  // scans. The same file can be re-imported on another device, so progress can
  // be moved between phones manually. Data already persists offline via
  // localStorage; this button is for explicit backup / transfer.
  function pickFile() {
    return new Promise((resolve) => {
      const input = $('importFile');
      input.value = '';
      const onChange = () => {
        input.removeEventListener('change', onChange);
        resolve(input.files && input.files[0] ? input.files[0] : null);
      };
      input.addEventListener('change', onChange, { once: true });
      input.click();
    });
  }
  async function syncAction() {
    if (consents.length === 0) {
      // Nothing local to back up — offer to import instead.
      if (confirm('No data to back up. Import a backup file?')) {
        const file = await pickFile();
        if (file) await importBackup(file);
      }
      return;
    }
    const choice = prompt('Sync:\n  1 = Download backup (this phone)\n  2 = Import backup (replace data)\n  3 = Import backup (merge)\n\nEnter 1, 2 or 3:', '1');
    if (choice === '1' || choice == null) return downloadBackup();
    if (choice === '2') {
      const file = await pickFile();
      if (file) await importBackup(file, /*replace*/ true);
      return;
    }
    if (choice === '3') {
      const file = await pickFile();
      if (file) await importBackup(file, /*replace*/ false);
      return;
    }
  }
  function downloadBackup() {
    const payload = {
      app: 'mjm-scan-counter',
      version: 1,
      exportedAt: new Date().toISOString(),
      consents,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mjm-scan-backup-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup downloaded', 'done');
  }
  async function importBackup(file, replace) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const incoming = Array.isArray(data) ? data : (Array.isArray(data.consents) ? data.consents : null);
      if (!incoming) throw new Error('Unrecognised file');
      if (replace) {
        consents = incoming;
      } else {
        // Merge by id; incoming with more recent scans wins per consent
        const byId = new Map(consents.map(c => [c.id, c]));
        incoming.forEach(c => {
          const existing = byId.get(c.id);
          if (!existing) {
            consents.push(c);
          } else if ((c.unique || 0) >= (existing.unique || 0)) {
            Object.assign(existing, c);
          }
        });
      }
      saveAll();
      renderConsentList();
      toast(`Imported ${incoming.length} consent(s)`, 'done');
    } catch (e) {
      alert('Import failed: ' + e.message);
    }
  }
  $('syncBtn').addEventListener('click', syncAction);
  $('importFile').addEventListener('click', e => e.stopPropagation());

  // ---------- Online / offline indicator ----------
  function updateNetwork() {
    const online = navigator.onLine;
    netDot.classList.toggle('offline', !online);
    // Only override status text if we're not actively scanning
    if (!html5QrCode || !html5QrCode.isScanning) {
      setStatus(online ? 'STANDBY' : 'OFFLINE', online ? '' : 'offline');
    }
  }
  window.addEventListener('online', updateNetwork);
  window.addEventListener('offline', updateNetwork);

  // ---------- Service worker (offline support) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err =>
        console.warn('SW registration failed', err)
      );
    });
  }

  // ---------- Init ----------
  loadAll();
  renderConsentList();
  updateNetwork();
</script>
</body>
</html>
