<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MJM Scan" />
  <title>MJM Scan &amp; DO</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon-B5EoKwz6.svg" />
  <link rel="apple-touch-icon" href="./assets/icon-B5EoKwz6.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;600;700;900&family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/app-C2hRx1Tv.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/app-DvBSpx2Z.css">
</head>
<body>
  <div id="root"></div>
  <script>
    // Resilience + diagnostics for returning users. The previous version of this
    // site was an offline PWA, so a stale service worker / cache can serve a
    // broken shell. On first blank load we clear old SWs + caches and reload
    // once. If it is STILL blank after that, we show the captured error on
    // screen instead of a blank page so the problem is visible.
    (function () {
      var errs = [];
      // Capture phase, so a script/stylesheet that 404s is recorded too. A
      // resource error fires on the element and never reaches a bubbling
      // window listener — which is why a missing bundle used to report
      // "no JavaScript error was captured" and tell nobody anything.
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.src || el.href)) {
          errs.push('Failed to load ' + (el.tagName || '?').toLowerCase() + ': ' + (el.src || el.href));
          return;
        }
        errs.push((e.message || 'error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        errs.push('promise: ' + ((r && (r.stack || r.message)) || r));
      });

      // Proactively remove any service worker + caches left by the old PWA so
      // they can never serve a stale shell again. No reload — just clean up.
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) {
            ks.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      } catch (e) {}
      /* Every build renames the JS: assets/index-<hash>.js, and one chunk per
         lazy module. That is deliberate — it makes CDN caching safe — but it
         also means a browser holding an older index.html asks for filenames
         that no longer exist, and gets a 404. Unlike the other modules, which
         are plain files whose names never change, this app breaks that way
         after every single deploy. So a stale shell must reload itself rather
         than becoming an error screen. */
      function reloadForStaleBuild() {
        var k = 'mjm-stale-reload';
        var last = Number(sessionStorage.getItem(k) || 0);
        // One escape attempt per 20s. Without this, a genuine outage would
        // turn into a reload loop that never shows anyone the error.
        if (Date.now() - last < 20000) return false;
        sessionStorage.setItem(k, String(Date.now()));
        var base = location.pathname.replace(/[?].*$/, '');
        // Keep the hash: HashRouter puts the current route there, so the user
        // lands back where they were instead of at the dashboard.
        location.replace(base + '?cb=' + Date.now() + (location.hash || ''));
        return true;
      }

      /* Vite fires this when a lazy module's chunk fails to download — the
         usual shape of "it broke right after a change", because each module
         is its own hashed chunk fetched only when opened. Recover instead of
         letting it reach the error boundary. */
      window.addEventListener('vite:preloadError', function (e) {
        if (reloadForStaleBuild()) e.preventDefault();
      });

      function hardReset(forceAgain) {
        var p = Promise.resolve();
        if ('serviceWorker' in navigator) {
          p = p.then(function () {
            return navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            });
          });
          // unregister() does not evict a worker that is already controlling
          // this page — it goes when the last client using it unloads. Reload
          // too early and the very worker we are escaping answers the
          // navigation, which is how a device gets stuck on a dead shell
          // reloading forever. Wait for control to be released first.
          p = p.then(function () {
            if (!navigator.serviceWorker.controller) return null;
            return new Promise(function (res) {
              var done = false;
              var finish = function () { if (!done) { done = true; res(); } };
              navigator.serviceWorker.addEventListener('controllerchange', finish);
              setTimeout(finish, 1500);   // never hang on this
            });
          });
        }
        if (window.caches && caches.keys) {
          p = p.then(function () {
            return caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            });
          });
        }
        var go = function () {
          if (forceAgain) sessionStorage.setItem('mjm-sw-reset', '1');
          // Bypass any HTTP-cached index.html by loading a cache-busted URL.
          var base = location.pathname.replace(/[?].*$/, '');
          location.replace(base + '?cb=' + Date.now() + (location.hash || ''));
        };
        p.then(go, go);
      }
      function showOverlay() {
        var root = document.getElementById('root');
        if (!root) return;
        // /src/main.jsx only exists before the app is built. If the browser is
        // asking for it, it is running a shell left over from an old
        // deployment, not anything the live site serves — so say that plainly
        // rather than leaving it as an unexplained failure.
        var devShell = errs.join(' ').indexOf('/src/main.jsx') !== -1;
        root.innerHTML =
          '<div style="font-family:system-ui,sans-serif;padding:22px;max-width:680px;margin:0 auto;color:#0b1220">' +
          '<h2 style="color:#c12842;margin:0 0 8px">App could not load</h2>' +
          (devShell
            ? '<p style="color:#475569;font-size:14px">This device is holding an <b>old copy</b> of the page from a ' +
              'previous version of the site. The live site is fine — open it in a private window to confirm. ' +
              'Tap the button below to clear it; if it comes back, close this tab completely and reopen the site.</p>'
            : '') +
          '<p style="color:#475569;font-size:14px">Please screenshot this and send it. Or tap the button to clear the cache and retry.</p>' +
          '<pre style="white-space:pre-wrap;background:#f1f5f9;border:1px solid #cdd5de;border-radius:8px;padding:12px;font-size:12px;overflow:auto">' +
          (errs.length ? errs.join('\n\n') : 'No JavaScript error was captured — the app script may not have downloaded (network, or a cached copy of this page pointing at files that no longer exist).\n\nTry: tap the button below, or open the site in a private window.') +
          '\n\nURL: ' + location.href + '\nBrowser: ' + navigator.userAgent + '</pre>' +
          '<button id="mjm-reset" style="padding:12px 18px;border:none;border-radius:10px;background:#10b981;color:#fff;font-weight:700;cursor:pointer">Clear cache &amp; reload</button>' +
          '</div>';
        var b = document.getElementById('mjm-reset');
        if (b) b.onclick = function () { hardReset(true); };
      }
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            // Mounted. Forget the earlier attempts, or a later failure in the
            // same session — a lazy chunk 404 on the next screen, say — would
            // find the counter already spent and go straight to the error
            // screen without ever retrying.
            sessionStorage.removeItem('mjm-sw-reset');
            return;
          }
          var tries = Number(sessionStorage.getItem('mjm-sw-reset') || 0);
          if (tries < 2) {
            sessionStorage.setItem('mjm-sw-reset', String(tries + 1));
            hardReset(false);
            return;
          }
          showOverlay();
        }, 5000);
      });
    })();
  </script>
</body>
</html>
